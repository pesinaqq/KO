# KO影视 美化版客户端 Windows 编译（AppVeyor 备用通道）
# 仅编译 Flutter 客户端并压缩 Release；安装包组装在 VM 侧完成（引擎/运行时/bridge 已就位）。
# 触发方式：推送到 main 即自动构建；或 AppVeyor 界面点 Rebuild。
version: '{build}'
image: Visual Studio 2022
clone_depth: 1

environment:
  FLUTTER_VERSION: 3.44.8

install:
  # 下载并解压 Flutter SDK（与上游 CI 同档版本）
  - ps: >-
      $f = "C:\flutter";
      if (-not (Test-Path "$f\bin\flutter.bat")) {
        $url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_$env:FLUTTER_VERSION-stable.zip";
        Write-Host "download $url";
        Invoke-WebRequest -Uri $url -OutFile C:\flutter.zip;
        Expand-Archive C:\flutter.zip -DestinationPath C:\;
      }
  - set PATH=C:\flutter\bin;C:\Program Files\Git\bin;%PATH%
  - flutter --version
  - flutter config --no-analytics

build_script:
  - cd flutter
  - flutter pub get
  - flutter build windows --release
  - ps: >-
      if (Test-Path ..\KOTV-client-Release.zip) { Remove-Item ..\KOTV-client-Release.zip -Force }
      Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ..\KOTV-client-Release.zip -CompressionLevel Optimal
      Get-ChildItem ..\KOTV-client-Release.zip | Format-Table Name, Length

artifacts:
  - path: KOTV-client-Release.zip
    name: KOTV-client-Release
    type: zip
