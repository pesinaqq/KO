name: kotv
description: KO影视 Flutter UI（Go 引擎 :9978）
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  # 主线拉最新兼容版；Win7 线由 adapt-flutter-win7-sdk.sh 尽量钉到同档新版本。
  media_kit: ^1.2.6
  media_kit_video: ^1.3.1
  media_kit_libs_video: ^1.0.7
  video_player: ^2.9.2
  web: ^1.1.0
  fvp: ^0.37.3
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3
  window_manager: 0.4.3
  url_launcher: ^6.3.1
  # 添加源时选择本机配置文件；桌面走系统原生对话框。
  file_selector: ^1.0.0
  # 播放中防休眠/屏保（手机+桌面）；media_kit_video 也传递依赖，这里升为直接依赖以便统一管控。
  wakelock_plus: 1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/engine/
  # 内嵌 Noto 字体（全平台）：中文界面用 NotoSansSC 提升渲染质感；emoji 彩色/黑白兜底。
  # 注：Win7 线 adapt-flutter-win7-sdk.sh 检测到 NotoSansSC 已注册会跳过注入，互不冲突。
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Bold.otf
          weight: 700
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
          weight: 400
    - family: NotoEmoji
      fonts:
        - asset: assets/fonts/NotoEmoji.ttf
          weight: 400
